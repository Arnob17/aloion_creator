<!doctype html>
<html lang="bn">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>AloIon Photo-Card Generator</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Tiro+Bangla:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <script src="logo.js"></script>
        <div class="app-container">
            <header class="app-header">
                <div class="logo-text">আলোআয়ন <span>Creator</span></div>
                <p class="subtitle">Automated Social Media Card Generator</p>
            </header>

            <main class="main-content">
                <section class="editor-pane">
                    <div class="form-group">
                        <label for="templateSelect">Template Style</label>
                        <select id="templateSelect">
                            <option value="news">
                                News / Journal (Editorial)
                            </option>
                            <option value="quote">
                                Author - Quote (Minimalist)
                            </option>
                            <option value="quiz">Quiz</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="quote" id="mainLabel"
                            >Primary Text (Quote/Headline)</label
                        >
                        <textarea
                            id="quote"
                            placeholder="এখানে লিখুন..."
                            rows="4"
                        >
জ্ঞানের আলোয় আলোকিত হোক প্রতিটি জীবন।</textarea
                        >
                    </div>

                    <div class="form-group" id="authorGroup">
                        <label for="author">Author / Subtitle</label>
                        <input
                            type="text"
                            id="author"
                            placeholder="লেখকের নাম"
                            value="আলোআয়ন"
                        />
                    </div>

                    <div
                        class="form-group"
                        id="newsSnippetGroup"
                        style="display: none"
                    >
                        <label for="headline"
                            >Secondary Body Text (Optional)</label
                        >
                        <input
                            type="text"
                            id="headline"
                            placeholder="সংক্ষিপ্ত বর্ণনা..."
                            value=""
                        />
                    </div>

                    <div id="quizGroup" style="display: none">
                        <div class="form-group">
                            <label for="optionA">Option A</label>
                            <input type="text" id="optionA" value="অপশন ১" />
                        </div>
                        <div class="form-group">
                            <label for="optionB">Option B</label>
                            <input type="text" id="optionB" value="অপশন ২" />
                        </div>
                        <div class="form-group">
                            <label for="optionC">Option C</label>
                            <input type="text" id="optionC" value="অপশন ৩" />
                        </div>
                        <div class="form-group">
                            <label for="optionD">Option D</label>
                            <input type="text" id="optionD" value="অপশন ৪" />
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="category">Category Badge</label>
                        <input
                            type="text"
                            id="category"
                            placeholder="বিভাগ"
                            value="শিক্ষা"
                        />
                    </div>

                    <div class="form-group">
                        <label for="imageUpload">Background Image</label>
                        <div class="file-input-wrapper">
                            <button class="btn btn-secondary">
                                Choose Image
                            </button>
                            <input
                                type="file"
                                id="imageUpload"
                                accept="image/*"
                            />
                        </div>
                    </div>

                    <div class="controls-row">
                        <div class="form-group">
                            <label for="themeColor">Accent Color</label>
                            <input
                                type="color"
                                id="themeColor"
                                value="#FF8C00"
                            />
                        </div>
                        <div class="form-group">
                            <label for="overlayOpacity">Overlay Darken</label>
                            <input
                                type="range"
                                id="overlayOpacity"
                                min="0"
                                max="1"
                                step="0.1"
                                value="0.4"
                            />
                        </div>
                    </div>

                    <div class="actions">
                        <button id="generateBtn" class="btn btn-primary">
                            Refresh Canvas
                        </button>
                        <button id="downloadBtn" class="btn btn-accent">
                            Download PNG
                        </button>
                    </div>
                </section>

                <section class="preview-pane">
                    <div class="canvas-wrapper">
                        <canvas
                            id="cardCanvas"
                            width="1080"
                            height="1350"
                        ></canvas>
                    </div>
                    <p class="preview-hint">
                        1080x1350 (4:5 Ratio) Optimized for Facebook
                    </p>
                </section>
            </main>
        </div>

        <script src="script.js"></script>
    </body>
</html>
